[package]
name = "lmoxide-patcher-gui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Install, update and start LEGO Minifigures Online from an LMOxide patch server"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "persistence", "wayland", "x11"] }
lmoxide-patch = { version = "0.1.0", path = "../lmoxide/crates/lmoxide-patch" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "macros"] }

[dev-dependencies]
# the format eframe stores settings in
ron = "0.12"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
